let adminAlertAudioContext=null;
let adminKnownNotificationIds=null;
function unlockAdminNotificationSound(){
 try{
  const AudioContextClass=window.AudioContext||window.webkitAudioContext;
  if(!AudioContextClass)return;
  if(!adminAlertAudioContext)adminAlertAudioContext=new AudioContextClass();
  if(adminAlertAudioContext.state==="suspended")adminAlertAudioContext.resume().catch(()=>{});
 }catch(e){console.warn("Notification sound unavailable:",e.message)}
}
document.addEventListener("pointerdown",unlockAdminNotificationSound,{once:true});
document.addEventListener("keydown",unlockAdminNotificationSound,{once:true});
function playAdminNotificationSound(){
 try{
  if(!adminAlertAudioContext||adminAlertAudioContext.state!=="running")return;
  const ctx=adminAlertAudioContext;
  [0,0.22,0.44].forEach((delay,index)=>{
   const oscillator=ctx.createOscillator(),gain=ctx.createGain();
   oscillator.type="sine";
   oscillator.frequency.value=index===1?1046:880;
   gain.gain.setValueAtTime(0.0001,ctx.currentTime+delay);
   gain.gain.exponentialRampToValueAtTime(0.16,ctx.currentTime+delay+0.025);
   gain.gain.exponentialRampToValueAtTime(0.0001,ctx.currentTime+delay+0.16);
   oscillator.connect(gain);gain.connect(ctx.destination);
   oscillator.start(ctx.currentTime+delay);oscillator.stop(ctx.currentTime+delay+0.17);
  });
 }catch(e){console.warn("Notification sound error:",e.message)}
}

/* KYC IMAGE URL: supports Storage path and existing direct URL */
async function getKycImageUrl(value){
 if(!value)return "";
 const raw=String(value).trim();
 if(/^https?:\/\//i.test(raw)){
  if(raw.includes("/storage/v1/object/public/"+KYC_BUCKET+"/"))return raw;
  const marker="/"+KYC_BUCKET+"/";
  const at=raw.indexOf(marker);
  if(at<0)return raw;
  let path=raw.slice(at+marker.length).split("?")[0];
  path=path.replace(/^(public|sign)\//,"");
  const signed=await db.storage.from(KYC_BUCKET).createSignedUrl(path,3600);
  if(!signed.error&&signed.data?.signedUrl)return signed.data.signedUrl;
  return raw;
 }
 let path=raw.replace(/^\/+/,"").replace(new RegExp("^"+KYC_BUCKET.replace(/[.*+?^${}()|[\]\\]/g,"\\$&")+"/"),"");
 const signed=await db.storage.from(KYC_BUCKET).createSignedUrl(path,3600);
 if(!signed.error&&signed.data?.signedUrl)return signed.data.signedUrl;
 const pub=db.storage.from(KYC_BUCKET).getPublicUrl(path);
 return pub.data?.publicUrl||"";
}

/* WALLET CALCULATION */
function calculateWalletSummary(transactions,orders){
 let available=0,profit=0,applied=0;
 (transactions||[]).forEach(t=>{
  const type=String(t.transaction_type||"").toLowerCase().trim(),status=String(t.status||"").toLowerCase().trim(),amount=Math.abs(Number(t.amount)||0);
  if(!["approved","completed","success","successful","paid"].includes(status))return;
  if(type==="profit"){profit+=amount;available+=amount}
  else if(type==="purchase"||type==="applied")available-=amount;
  else if(type==="refund")available+=amount;
  else if(type==="withdrawal"||type.includes("minus")||type.includes("debit")||type.includes("payment"))available-=amount;
  else if(type.includes("add_balance")||type==="credit"||type==="deposit"||type==="income"||type==="add balance")available+=amount;
 });
 (orders||[]).forEach(o=>{
  const status=String(o.status||"").toLowerCase().trim();
  if(["processing","shipping","shipped","picked_up","picked up","in_progress"].includes(status)){
   const amount=Number(o.total_amount??o.product_price??0);if(Number.isFinite(amount)&&amount>0)applied+=amount;
  }
 });
 return {available:Math.max(0,available),profit:Math.max(0,profit),applied:Math.max(0,applied)};
}
function calculateAvailableBalance(transactions){return calculateWalletSummary(transactions,[]).available}

async function refreshOrderPickupNotifications(){
 const box=document.getElementById("orderPickupNotificationList");
 if(current!=="orders"||!box)return;
 try{
  const nr=await db.from("admin_notifications").select("id,customer_id,title,message,source_id,created_at").eq("source_table","orders").eq("is_read",false).order("created_at",{ascending:false}).limit(100);
  if(nr.error)throw nr.error;
  const notifications=nr.data||[];
  if(!notifications.length){box.innerHTML='<p class="muted">No customer pickup notifications.</p>';return}
  const orderIds=[...new Set(notifications.map(n=>String(n.source_id||"")).filter(Boolean))];
  const or=orderIds.length?await db.from("orders").select("id,customer_id,status").in("id",orderIds):{data:[],error:null};
  if(or.error)throw or.error;
  const orderMap=new Map((or.data||[]).map(o=>[String(o.id),o]));
  // Show only orders currently marked PICKED, one notification per order.
  const pickedNotifications=[],seenOrderIds=new Set();
  for(const n of notifications){
   const oid=String(n.source_id||""),order=orderMap.get(oid);
   if(!order||String(order.status||"").toLowerCase().trim()!=="picked"||seenOrderIds.has(oid))continue;
   seenOrderIds.add(oid);pickedNotifications.push(n);
  }
  if(!pickedNotifications.length){box.innerHTML='<p class="muted">No customer pickup notifications.</p>';return}
  box.innerHTML=pickedNotifications.map(n=>{
   const order=orderMap.get(String(n.source_id||""));
   const customerId=order.customer_id||n.customer_id;
   const name=customerName(customerId),email=customerEmail(customerId);
   return `<div class="customer" style="padding:10px;margin:7px 0">
    <strong>🔔 Customer picked up an order</strong>
    <p style="margin:5px 0">${esc(name)} ${email?"— "+esc(email):""}</p>
    <div class="muted">Order ID: ${esc(n.source_id||"—")} · Status: PICKED · ${esc(n.created_at?new Date(n.created_at).toLocaleString():"")}</div>
    <button class="green" onclick="setPickupOrderProcessing('${esc(n.id)}','${esc(order.id)}')">Change Status to Processing</button>
   </div>`;
  }).join("");
 }catch(e){console.error("Order pickup notifications:",e);box.innerHTML='<p class="error">Pickup notifications load error: '+esc(e.message)+'</p>'}
}

async function sendOrder(){
 const cid=val("ocustomer"),rows=[...document.querySelectorAll(".batch-product-row")].filter(row=>row.querySelector(".batch-product-check")?.checked);
 if(!cid)return note("Pehle customer select karein.",true);
 if(!rows.length)return note("Kam az kam aik product checkbox se select karein.",true);
 const batch=[];
 for(const row of rows){
  const p=customerProductRows.find(x=>String(x.id)===String(row.dataset.productId)),qty=Number(row.querySelector(".batch-product-qty")?.value),profit=Number(row.querySelector(".batch-product-profit")?.value);
  if(!p||String(p.customer_id)!==cid||!Number.isInteger(qty)||qty<1)return note("Selected products ki quantity check karein.",true);
  if(!Number.isFinite(Number(p.price))||Number(p.price)<0||!Number.isFinite(profit)||profit<0)return note("Product price ya profit amount check karein.",true);
  batch.push({p,qty,unitPrice:Number(p.price),total:Number(p.price)*qty,profit});
 }
 const b=document.getElementById("sendOrderButton");if(!b)return;b.disabled=true;
 const claimed=[],created=[];
 try{
  for(const item of batch){
   const orderedAt=new Date().toISOString();
   const claim=await db.from("customer_products").update({ordered_at:orderedAt}).eq("id",item.p.id).is("ordered_at",null).select("id").maybeSingle();
   if(claim.error)throw claim.error;
   if(!claim.data)throw new Error("Selected customer product pehle hi order ho chuka hai. Refresh karke dobara try karein.");
   claimed.push({id:item.p.id,orderedAt});
   const o=await db.from("orders").insert({customer_id:cid,status:"pending",total_amount:item.total,admin_profit:item.profit}).select("id").single();
   if(o.error)throw o.error;
   created.push(o.data.id);
   const it=await db.from("order_items").insert({order_id:o.data.id,product_id:item.p.product_id,product_name:item.p.product_name||"Product",quantity:item.qty,unit_price:item.unitPrice});
   if(it.error)throw it.error;
  }
  const sentIds=new Set(batch.map(x=>String(x.p.id)));
  customerProductRows=customerProductRows.filter(x=>!sentIds.has(String(x.id)));
  orderCustomerFilterId=String(cid);const filter=document.getElementById("orderCustomerFilter");if(filter)filter.value=orderCustomerFilterId;
  note(batch.length+" orders successfully sent. Selected products are removed from the available list.");
  renderOrderProductOptions();
  if(current==="orders")await loadOrders();
 }catch(e){
  for(const id of created.reverse())await db.from("orders").delete().eq("id",id);
  for(const item of claimed.reverse())await db.from("customer_products").update({ordered_at:null}).eq("id",item.id).eq("ordered_at",item.orderedAt);
  note("Order save error: "+e.message,true);
 }finally{const btn=document.getElementById("sendOrderButton");if(btn)btn.disabled=false}
}
async function creditCompletedOrder(orderId){
 const orderResult=await db.from("orders").select("*").eq("id",orderId).single();if(orderResult.error)throw orderResult.error;
 const order=orderResult.data;if(String(order.status).toLowerCase()!=="completed")return;
 const customerId=order.customer_id,productPrice=Number(order.total_amount??order.product_price??0),profit=Number(order.admin_profit??0);
 if(!customerId)throw new Error("Order customer missing.");
 if(!Number.isFinite(productPrice)||productPrice<0||!Number.isFinite(profit)||profit<0)throw new Error("Order amount invalid.");
 const depositCheck=await db.from("wallet_transactions").select("id").eq("customer_id",customerId).eq("reference_id",orderId).eq("transaction_type","deposit").limit(1);
 if(depositCheck.error)throw depositCheck.error;
 if(!depositCheck.data.length&&productPrice>0){
  const deposit=await db.from("wallet_transactions").insert({customer_id:customerId,amount:productPrice,transaction_type:"deposit",status:"completed",description:"Completed order product price returned",reference_id:orderId});if(deposit.error)throw deposit.error;
 }
 const profitCheck=await db.from("wallet_transactions").select("id").eq("customer_id",customerId).eq("reference_id",orderId).eq("transaction_type","profit").limit(1);
 if(profitCheck.error)throw profitCheck.error;
 if(!profitCheck.data.length&&profit>0){
  const result=await db.from("wallet_transactions").insert({customer_id:customerId,amount:profit,transaction_type:"profit",status:"completed",description:"Completed order profit",reference_id:orderId});if(result.error)throw result.error;
 }
}

async function updateOrder(id){

 try{const r=await db.from("orders").update({status}).eq("id",id).select("*").single();if(r.error)throw r.error;if(status!=="picked"){const handled=await db.from("admin_notifications").update({is_read:true}).eq("source_table","orders").eq("source_id",id).eq("is_read",false);if(handled.error)throw handled.error}if(status==="completed"){await creditCompletedOrder(id);note("Order completed. Wallet credit check ho gaya.")}else note("Order successfully "+status+" ho gaya.");if(current==="orders"){await loadOrders();await refreshOrderPickupNotifications()}}

async function kycStatus(id,status){
 if(!["approved","rejected"].includes(status))return note("Invalid KYC status.",true);
 if(!confirm("Are you sure you want to "+(status==="approved"?"APPROVE":"REJECT")+" this KYC request?"))return;
 try{
  const r=await db.from("kyc_submissions").update({status}).eq("id",id).ilike("status","pending").select("id,customer_id").maybeSingle();
  if(r.error)throw r.error;
  if(!r.data){note("This KYC request has already been processed. No changes made.",true);if(current==="kyc_submissions")await kycPage();return}
  if(status==="approved"){
   const profile=await db.from("profiles").select("credit_score").eq("id",r.data.customer_id).maybeSingle();
   if(profile.error)throw profile.error;
   if(profile.data){
    const oldScore=Number(profile.data.credit_score??0);
    const update=await db.from("profiles").update({credit_score:100}).eq("id",r.data.customer_id);
    if(update.error)throw update.error;
    if(oldScore!==100){
     const history=await db.from("credit_score_history").insert({customer_id:r.data.customer_id,old_score:oldScore,new_score:100,change_amount:100-oldScore,reason:"KYC approved"});
     if(history.error)note("KYC approved and credit score set to 100, but history save failed: "+history.error.message,true);
     else note("KYC approved successfully. Credit score is now 100%.");
    }else note("KYC approved successfully. Credit score is 100%.");
   }else note("KYC approved, but customer profile was not found.",true);
  }else note("KYC rejected successfully.");
  if(current==="kyc_submissions")await kycPage();
 }catch(e){note("KYC update error: "+e.message,true)}
}

async function deleteCustomerAccount(id){
 const c=customers.find(x=>String(x.id)===String(id));
 if(!c)return note("Customer not found.",true);
 const label=(c.full_name||"Customer")+" ("+(c.email||id)+")";
 if(!confirm("Permanently delete "+label+"?\n\nThis will delete the customer's account and related records. This action cannot be undone."))return;
 try{
  const {data,error}=await db.functions.invoke("admin-delete-customer",{body:{customer_id:id,expected_email:c.email}});
  if(error)throw error;
  if(data?.error)throw new Error(data.error);
  if(!data?.success)throw new Error("Delete function did not confirm success.");
  note("Customer account permanently deleted.");
  await loadCustomers();
  if(current==="customers")await customersPage();
 }catch(e){
  let detail=e?.message||"Check Edge Function setup.";
  try{
   if(e?.context&&typeof e.context.clone==="function"){
    const response=e.context.clone();
    const body=await response.text();
    if(body){
     let serverMessage=body;
     try{
      const parsed=JSON.parse(body);
      serverMessage=[parsed.error||parsed.message||parsed.msg,parsed.details].filter(Boolean).join(" — ")||body;
     }catch(_){}
     detail+=" (HTTP "+response.status+"): "+serverMessage;
    }else{
     detail+=" (HTTP "+response.status+")";
    }
   }
  }catch(_){}
  note("Delete failed: "+detail,true);
 }
}

 if(approvedResult.error)throw approvedResult.error;
 supportApprovedCustomerIds=new Set((approvedResult.data||[]).map(x=>String(x.customer_id||"").trim()).filter(Boolean));
 const r=await db.from("support_chat_messages").select("*").order("created_at",{ascending:true}).limit(1000);
 if(r.error)throw r.error;
 if(!pageIs("support_messages",version))return;
 supportMessages=r.data||[];
 supportLastSignature=JSON.stringify(supportMessages);
 try{activeSupportCustomerId=sessionStorage.getItem("smartSellerActiveSupportCustomer")||null;}catch(e){activeSupportCustomerId=null;}
 putContent(`<h2>Customer Service Chat</h2>
 <p class="muted">Customer ka Gmail select karke chat open karein. Naye messages automatically refresh honge.</p>
 <button class="gray" onclick="refreshSupportMessages(true)">Refresh Messages</button>
 <input id="supportSearch" placeholder="Search customer name or Gmail" oninput="filterSupportCustomers()">
 <div id="supportCustomerList"></div>`,"support_messages",version);
 renderSupportCustomers();
 if(activeSupportCustomerId&&supportMessages.some(m=>String(m.customer_id)===String(activeSupportCustomerId))){
  const savedCustomerId=activeSupportCustomerId;
  openSupportChat(savedCustomerId,true);
 }
 if(!supportRefreshTimer) supportRefreshTimer=setInterval(()=>{if(current==="support_messages")refreshSupportMessages();},5000);
 refreshAdminBadges();
}
function makeSupportGroups(){
 const groups={};
 supportMessages.forEach(m=>{(groups[String(m.customer_id)]??=[]).push(m);});
 window.supportGroups=groups;
 return groups;
}
function renderSupportCustomers(){
 const box=document.getElementById("supportCustomerList");
 if(!box)return;
 const groups=makeSupportGroups();
 const q=(document.getElementById("supportSearch")?.value||"").toLowerCase();
 const ids=[...new Set([...Object.keys(groups),...supportApprovedCustomerIds,...supportCustomers.map(c=>String(c.id)),...customers.map(c=>String(c.id))])].filter(id=>{
  const msgs=groups[id]||[];
  const unread=msgs.filter(m=>String(m.sender_role||m.sender||"").toLowerCase()==="customer"&&!m.read_at).length;
  return (String(supportCustomerName(id))+" "+supportCustomerEmail(id)).toLowerCase().includes(q);
 }).sort((a,b)=>{
  const latestCustomerMessage=id=>(groups[id]||[]).filter(m=>String(m.sender_role||m.sender||"").toLowerCase()==="customer").reduce((latest,m)=>Math.max(latest,Date.parse(m.created_at)||0),0);
  return latestCustomerMessage(b)-latestCustomerMessage(a);
 });
 box.innerHTML=ids.map(id=>{
  const msgs=groups[id]||[];
  const unread=msgs.filter(m=>String(m.sender_role||m.sender||"").toLowerCase()==="customer"&&!m.read_at).length;
  const name=supportCustomerName(id),email=supportCustomerEmail(id);
  const summary=unread+" unread message"+(unread===1?"":"s");
  return `<div class="support-row">
   <b class="support-customer" title="${esc(name)}" onclick="openCustomerProfile('${esc(id)}')">${esc(name)}</b>
   <span class="support-email" title="${esc(email)}" onclick="openCustomerProfile('${esc(id)}')">${esc(email)}</span>
   <span class="support-summary">${esc(summary)}</span>
   ${unread?`<span class="support-unread">${unread} unread</span>`:`<span class="support-read">${msgs.length?"All read":"No messages"}</span>`}
   <button class="gray" onclick="openSupportChat('${esc(id)}')">Open Chat</button>
  </div>`;
 }).join("")||"No customer accounts found.";
}
function filterSupportCustomers(){renderSupportCustomers();}
async function refreshSupportMessages(force=false){
 if(current!=="support_messages"||supportRefreshing)return;
 supportRefreshing=true;
 try{
  await loadCustomers();
  supportCustomers=customers.map(c=>({id:c.id,full_name:c.full_name,email:c.email}));
  const r=await db.from("support_chat_messages").select("*").order("created_at",{ascending:true}).limit(1000);
  if(r.error)throw r.error;
  const next=r.data||[],signature=JSON.stringify(next);
  if(force||signature!==supportLastSignature){
   supportMessages=next;supportLastSignature=signature;makeSupportGroups();
   if(activeSupportCustomerId)openSupportChat(activeSupportCustomerId,true);else renderSupportCustomers();
  }
 }catch(e){console.error("Customer Service refresh:",e.message);}
 finally{supportRefreshing=false;refreshAdminBadges();}
}
function closeAdminSupportChat(){document.body.classList.remove("admin-chat-open");activeSupportCustomerId=null;try{sessionStorage.removeItem("smartSellerActiveSupportCustomer");}catch(e){}supportPage();}
async function openSupportChat(customerId,preserveDraft=false){
 const previousBox=document.getElementById("supportChatMessages");
 const previousScrollTop=previousBox?.scrollTop||0;
 const wasAtBottom=previousBox?previousBox.scrollHeight-previousBox.scrollTop-previousBox.clientHeight<100:true;
 document.body.classList.add("admin-chat-open");
 try{sessionStorage.setItem("smartSellerActiveSupportCustomer",String(customerId));}catch(e){}
 const draft=document.getElementById("supportReply")?.value||"";
 activeSupportCustomerId=String(customerId);
 const messages=window.supportGroups?.[activeSupportCustomerId]||[];
 document.body.classList.add("admin-chat-open");
 putContent(`<section class="admin-chat-screen">
  <div class="chat-topbar"><button type="button" class="chat-back" onclick="closeAdminSupportChat()">‹</button><div><strong>${esc(supportCustomerName(customerId))}</strong><small>${esc(supportCustomerEmail(customerId))}</small></div><span class="chat-online"></span></div>
  <div id="supportChatMessages" class="chat-scroll"></div>
  <form id="adminSupportForm" class="chat-composer"><textarea id="supportReply" placeholder="Type a message..." rows="1">${preserveDraft?esc(draft):""}</textarea><input id="adminSupportImage" type="file" accept="image/jpeg,image/png,image/webp,image/gif" hidden><button type="button" class="attach-picture" onclick="document.getElementById('adminSupportImage').click()" aria-label="Attach picture">📷 Picture</button><button type="button" id="sendSupportReply" class="send-message" aria-label="Send message" onclick="sendReply()">Send ➤</button></form>
 </section>`,"support_messages",pageVersion);
 const replyForm=document.getElementById("adminSupportForm");
 if(replyForm)replyForm.addEventListener("submit",event=>{event.preventDefault();sendReply();});
 const box=document.getElementById("supportChatMessages");
 if(!box)return;
 const renderedMessages=await Promise.all(messages.map(async m=>{
   const role=String(m.sender_role||m.sender||"customer").toLowerCase();const admin=role==="admin";let imageHtml="";
   if(m.image_path){const signed=await db.storage.from("support-chat-images").createSignedUrl(m.image_path,3600);if(signed.error)throw signed.error;const url=esc(signed.data.signedUrl);imageHtml=`<a href="${url}" target="_blank" rel="noopener"><img style="display:block;max-width:230px;max-height:230px;width:auto;height:auto;object-fit:contain;border-radius:10px;margin-top:7px" src="${url}" alt="Customer Service attachment"></a>`;}
   return `<div class="${admin?"chat-message":"chat-reply"}">${m.message?`<p>${esc(m.message)}</p>`:""}${imageHtml}<small class="chat-time">${m.created_at?new Date(m.created_at).toLocaleString():""}</small></div>`;
  }));
  box.innerHTML=renderedMessages.join("")||"No messages.";
 const restoreChatScroll=()=>{
  if(!box.isConnected)return;
  box.scrollTop=preserveDraft?(wasAtBottom?box.scrollHeight:previousScrollTop):box.scrollHeight;
 };
 restoreChatScroll();
 const chatImages=[...box.querySelectorAll("img")];
 if(chatImages.length)Promise.all(chatImages.map(img=>img.decode?img.decode().catch(()=>{}):Promise.resolve())).then(restoreChatScroll);
 const unreadIds=messages.filter(m=>String(m.sender_role||m.sender||"").toLowerCase()==="customer"&&!m.read_at).map(m=>m.id).filter(Boolean);
 if(unreadIds.length){
  try{
   const readTime=new Date().toISOString();
   const marked=await db.from("support_chat_messages").update({read_at:readTime}).in("id",unreadIds).select("id,read_at");
   if(marked.error)throw marked.error;
   const readIds=new Set((marked.data||[]).map(m=>String(m.id)));
   supportMessages=supportMessages.map(m=>readIds.has(String(m.id))?{...m,read_at:readTime}:m);
   supportLastSignature=JSON.stringify(supportMessages);
   makeSupportGroups();
   renderSupportCustomers();
   await refreshAdminBadges();
  }catch(e){note("Read status update error: "+e.message,true);}
 }
}
async function sendReply(){
 const customerId=activeSupportCustomerId;
 const el=document.getElementById("supportReply"),btn=document.getElementById("sendSupportReply");
  const imageFile=document.getElementById("adminSupportImage")?.files?.[0]||null;
  if(!customerId||!el||(!el.value.trim()&&!imageFile))return note("Reply likhein ya image attach karein.",true);
  if(imageFile&&(!imageFile.type.startsWith("image/")||imageFile.size>5*1024*1024))return note("Image sirf JPG, PNG, WEBP ya GIF ho aur 5 MB se choti ho.",true);
  if(sendingReplyIds.has(customerId))return;
  const message=el.value.trim();
 sendingReplyIds.add(customerId);
 if(btn){btn.disabled=true;btn.textContent="Sending...";}
 try{
  let imagePath=null;
   if(imageFile){const ext=(imageFile.name.split(".").pop()||"jpg").toLowerCase().replace(/[^a-z0-9]/g,"")||"jpg";imagePath=customerId+"/"+(crypto.randomUUID?crypto.randomUUID():Date.now())+"."+ext;const uploaded=await db.storage.from("support-chat-images").upload(imagePath,imageFile,{contentType:imageFile.type,cacheControl:"3600",upsert:false});if(uploaded.error)throw uploaded.error;}
   const r=await db.from("support_chat_messages").insert({customer_id:customerId,sender:"admin",sender_role:"admin",message:message||"",image_path:imagePath});if(r.error)throw r.error;
   const imageInput=document.getElementById("adminSupportImage");if(imageInput)imageInput.value="";
  note("Admin message successfully send ho gaya.");
  const refreshed=await db.from("support_chat_messages").select("*").order("created_at",{ascending:true}).limit(1000);
  if(refreshed.error)throw refreshed.error;
  supportMessages=refreshed.data||[];supportLastSignature=JSON.stringify(supportMessages);makeSupportGroups();
  if(current==="support_messages"&&activeSupportCustomerId===customerId)openSupportChat(customerId,false);
 }catch(e){note("Message error: "+e.message,true);if(btn){btn.disabled=false;btn.textContent="Send ➤";}}
 finally{sendingReplyIds.delete(customerId);}
}

/* NOTIFICATIONS */
async function notificationsPage(version=pageVersion){
 await loadCustomers();
 const r=await db.from("admin_notifications").select("*").eq("is_read",false).in("source_table",["withdrawals","kyc_submissions","support_chat_messages","support_messages"]).order("created_at",{ascending:false}).limit(300);
 if(r.error)throw r.error;if(!pageIs("notifications",version))return;
 const rows=r.data||[];
 const html=rows.length?rows.map(n=>{
  const customer=n.customer_id?customerName(n.customer_id):"Customer";
  const email=n.customer_id?customerEmail(n.customer_id):"";
  const when=n.created_at?new Date(n.created_at).toLocaleString():"";
  return `<div id="admin-notification-${esc(n.id)}" class="customer" onclick="openAdminNotification('${esc(n.id)}',this)">
   <strong>${esc(n.title)}</strong><p style="margin:5px 0">${esc(n.message)}</p>
   <div class="muted">${esc(customer)} ${email&&email!=="Email not available"?"— "+esc(email):""} · ${esc(when)}</div>
   <small class="muted">Open to mark as read</small>
  </div>`;
 }).join(""):"<p class='muted'>No unread notifications.</p>";
 putContent(`<h2>Notifications</h2><p class="muted">Unread notifications yahan rahengi. Open karte hi list se hat jayengi.</p><button class="gray" onclick="notificationsPage()">Refresh</button><div class="panel" id="adminNotificationsList">${html}</div>`,"notifications",version);
}
async function openAdminNotification(id,element){
 if(!id)return;
 const row=element||document.getElementById("admin-notification-"+id);
 if(row)row.style.opacity=".5";
 const notification=await db.from("admin_notifications").select("id,customer_id,source_table").eq("id",id).maybeSingle();
 if(notification.error){if(row)row.style.opacity="1";note(notification.error.message,true);return;}
 if(!notification.data)return;
 const r=await db.from("admin_notifications").update({is_read:true}).eq("id",id).eq("is_read",false);
 if(r.error){if(row)row.style.opacity="1";note(r.error.message,true);return;}
 if(row)row.remove();
 const list=document.getElementById("adminNotificationsList");
 if(list&&!list.querySelector(".customer"))list.innerHTML="<p class='muted'>No unread notifications.</p>";
 await refreshAdminBadges();

 const source=String(notification.data.source_table||"");
 const destinations={
  profiles:"customers",
  support_chat_messages:"support_messages",
  support_messages:"support_messages",
  orders:"orders",
  customer_products:"customer_products",
  product_requests:"customer_products",
  withdrawals:"withdrawals",
  kyc_submissions:"kyc_submissions",
  wallet_transactions:"wallet_transactions",
  payment_submissions:"wallet_transactions"
 };
 const destination=destinations[source]||"customers";
 const button=[...document.querySelectorAll("aside button")].find(b=>(b.getAttribute("onclick")||"").includes("'"+destination+"'"));
 await go(destination,button||undefined);
 if((source==="support_chat_messages"||source==="support_messages")&&notification.data.customer_id){
  await openSupportChat(notification.data.customer_id);
 }
}

/* CREDIT SCORE */
let selectedCreditHistoryCustomerId=null;
async function creditPage(version=pageVersion){
 await loadCustomers();if(!pageIs("credit_score_history",version))return;
 selectedCreditHistoryCustomerId=null;
 putContent(`<h2>Credit Score History</h2><div class="panel"><h3>Change Customer Credit Score</h3>
 <label>Customer</label><select id="ccustomer" onchange="creditCustomerSelected()"><option value="">Select customer</option>
 ${customers.map(c=>`<option value="${esc(c.id)}">${esc(c.full_name||c.email||c.id)} — Current score: ${esc(c.credit_score??0)}</option>`).join("")}</select>
 <label>New Credit Score</label><input id="newScore" type="number" min="0" max="100">
 <label>Reason</label><input id="scoreReason" placeholder="Reason for score change">
 <button class="green" onclick="saveCreditScore()">Save Credit Score</button></div>
 <div class="panel"><h3>Credit Score History</h3>
 <label>Search customer by name or email</label>
 <input id="creditHistorySearch" type="search" placeholder="Enter customer name or email" oninput="selectedCreditHistoryCustomerId=null">
 <button class="green" onclick="searchCreditScoreHistory()">Search</button>
 <div id="creditHistoryResults"><p class="muted">Select a customer above to automatically view only that customer's credit score history.</p></div>
 </div>`,"credit_score_history",version);
}
function creditCustomerSelected(){
 const id=val("ccustomer");
 selectedCreditHistoryCustomerId=id||null;
 const customer=customers.find(c=>String(c.id)===String(id));
 const search=document.getElementById("creditHistorySearch");
 if(!customer||!search)return;
 search.value=customer.email||customer.full_name||"";
 searchCreditScoreHistory();
}
async function searchCreditScoreHistory(){
 const q=val("creditHistorySearch").toLocaleLowerCase();
 const box=document.getElementById("creditHistoryResults");
 if(!box)return;
 if(!selectedCreditHistoryCustomerId&&!q){box.innerHTML="<p class='error'>Customer name ya email enter karein.</p>";return;}
 let found=selectedCreditHistoryCustomerId?customers.filter(c=>String(c.id)===String(selectedCreditHistoryCustomerId)):[];
 if(!selectedCreditHistoryCustomerId){
  const matches=customers.filter(c=>String(c.full_name||"").toLocaleLowerCase()===q||String(c.email||"").toLocaleLowerCase()===q);
  found=matches.length?matches:customers.filter(c=>String(c.full_name||"").toLocaleLowerCase().includes(q)||String(c.email||"").toLocaleLowerCase().includes(q));
 }
 if(found.length===0){box.innerHTML="<p class='muted'>No customer found.</p>";return;}
 if(found.length>1){box.innerHTML="<p class='error'>Multiple customers found. Please enter the full name or email.</p>";return;}
 box.textContent="Loading...";
 const r=await db.from("credit_score_history").select("*").eq("customer_id",found[0].id).order("created_at",{ascending:false});
 if(r.error){box.innerHTML="<p class='error'>"+esc(r.error.message)+"</p>";return;}
 box.innerHTML=r.data?.length?renderCustomerLinkedTable(r.data):"<p class='muted'>Is customer ki koi credit score history nahi hai.</p>";
}
async function saveCreditScore(){
 const cid=val("ccustomer"),score=Number(val("newScore")),reason=val("scoreReason");
 if(!cid||val("newScore")===""||!Number.isInteger(score)||score<0||score>100)return note("Customer aur score 0 se 100 ke darmiyan likhein.",true);
 const c=customers.find(x=>String(x.id)===String(cid));if(!c)return note("Customer nahi mila.",true);
 const oldScore=Number(c.credit_score||0),update=await db.from("profiles").update({credit_score:score}).eq("id",cid);
 if(update.error)return note(update.error.message,true);
 const history=await db.from("credit_score_history").insert({customer_id:cid,old_score:oldScore,new_score:score,change_amount:score-oldScore,reason:reason||"Admin adjustment"});
 if(history.error)note("Score updated, lekin history save nahi hui: "+history.error.message,true);else note("Credit score successfully updated.");
 if(current==="credit_score_history")await creditPage();
}

check();
